url: "https://slowscotland.uk"
title: "Slow Scotland"
description: "A free 12-week slow travel journey by email, through quieter places in the Scottish Highlands and islands. Each week, a photograph, a short story and practical notes for visiting from photographer Mat Hayward."
# Used in page titles and social previews
tagline: "Slow travel by email, through Scotland's quieter places"
# Added to each story's description in search results and social previews
story_description_suffix: "A story from Slow Scotland, a free 12-week email journey through Scotland's quieter places."
author:
  name: "Mat Hayward"
  url: "https://mathayward.com"
  # Mat's other profiles, so search engines link them to the author. Keep in step with mathayward.com's schema.
  same_as:
    - "https://www.linkedin.com/in/mathaywarduk"

plugins:
  - jekyll-postcss
  - jekyll-minifier

# Public stories: one Markdown file each, with its own page.
# Teasers: locked stories that arrive by email. Front matter only, no page.
# To make a teaser public, move its file from _teasers to _stories and add the story.
collections:
  stories:
    output: true
    permalink: /stories/:name/
  teasers:
    output: false

defaults:
  - scope:
      type: stories
    values:
      layout: story
      signoff: Mat

# Signup form. Paste the Mailchimp embedded form action URL here when ready.
# e.g. https://slowscotland.us21.list-manage.com/subscribe/post?u=XXXX&id=YYYY
signup:
  # From the Mailchimp embedded form code: the form's action URL and the hidden "b_..." field name.
  mailchimp_action: "https://slowscotland.us11.list-manage.com/subscribe/post?u=7175e63d67cc05df1a4aff310&id=e41559d450&f_id=00389ce0f0"
  mailchimp_honeypot: "b_7175e63d67cc05df1a4aff310_e41559d450"
  # Shown under the form after a successful signup
  success: "Thanks. Check your inbox to confirm your email address."
  error: "Something went wrong. Please try again."
  # Shown when Mailchimp asks for a human check; the link opens Mailchimp's signup page
  captcha: "Almost there. Mailchimp needs to check you're not a robot."
  captcha_link: "Finish signing up"
  heading: "Start the journey"
  placeholder: "Enter your email address"
  button: "Go"
  note: "One email a week, for twelve weeks."
  privacy_link: "Read our privacy policy"
  locked_cta: "Arrives by email."
  locked_link: "Sign up free"

# Markdown, so links work
footer: 'Slow Scotland is an email series from [Mat Hayward](https://mathayward.com){:target="_blank" rel="noopener"}'
copyright: "Mat Hayward"

nav:
  - title: Stories
    url: /stories/
  - title: Slow travel
    url: /slow-travel/
  - title: About
    url: /about/

exclude:
  - package.json
  - package-lock.json
  - postcss.config.js
  - tailwind.config.js
  - README.md
  - netlify.toml
  - Gemfile
  - Gemfile.lock
  - node_modules
  - email
  - scripts

# Plain-text files must keep their line breaks
jekyll-minifier:
  exclude:
    - "robots.txt"
    - "llms.txt"
