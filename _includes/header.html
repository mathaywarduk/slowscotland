<header class="site-header">
  <nav class="site-nav" aria-label="Main">
    <ul>
      {% for item in site.nav %}
        {% if page.url contains item.url %}
          <li><a href="{{ item.url }}" class="is-current" aria-current="page">{{ item.title }}</a></li>
        {% else %}
          <li><a href="{{ item.url }}">{{ item.title }}</a></li>
        {% endif %}
      {% endfor %}
    </ul>
  </nav>
  <a href="/" class="site-logo">
    <img src="/assets/images/logo.svg" alt="Slow Scotland" width="545" height="308">
  </a>
</header>
