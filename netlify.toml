# Netlify build settings. Netlify installs the gems (Gemfile) and npm
# packages (package.json) itself, then runs the build command.
[build]
  # Set SITE_HIDDEN=true in Netlify's environment variables to serve a holding
  # page instead of the site (assets stay reachable for the email templates).
  command = "bundle exec jekyll build && if [ \"$SITE_HIDDEN\" = \"true\" ]; then sh scripts/hide-site.sh; fi"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.3.5"
  NODE_VERSION = "22"

# Fonts never change, so browsers can keep them for a year
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Netlify address serves the same site; send it to the real domain so
# search engines only see one copy. Deploy previews use other addresses.
[[redirects]]
  from = "https://slowscotland.netlify.app/*"
  to = "https://slowscotland.uk/:splat"
  status = 301
  force = true
