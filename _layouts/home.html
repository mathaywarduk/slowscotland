---
layout: default
---
<div class="home">
  <img class="home__bg" src="/assets/images/{{ page.hero.image }}" alt="{{ page.hero.alt }}" fetchpriority="high">
  <div class="home__main">
    <div class="home__heading">
      <h1>
        {%- for line in page.heading -%}
          <span class="home__line{% if line.indent %} indent-{{ line.indent }}{% endif %}">
            {%- include heading-line.html text=line.text -%}{{ " " }}
          </span>{% unless forloop.last %} {% endunless %}
        {%- endfor -%}
      </h1>
    </div>
    <div class="home__intro">
      {{ content }}
      {% if page.button %}<a class="button" href="{{ page.button.url }}">{{ page.button.text }}</a>{% endif %}
    </div>
  </div>
  <div class="home__signup" id="signup">
    {% include signup-form.html %}
  </div>
</div>
