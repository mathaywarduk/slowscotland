---
layout: default
---
<article class="page">
  {% assign heading = page.heading | default: page.title %}
  {% include h1.html text=heading %}
  <div class="prose page__body">
    {{ content }}
  </div>
  {% include signoff.html name=page.signoff %}
  {% if page.button %}{% include button.html url=page.button.url text=page.button.text class="page__button" %}{% endif %}
</article>
